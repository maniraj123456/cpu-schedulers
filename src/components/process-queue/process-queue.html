<section class="panel process-list-panel">
  <div class="panel-heading">
    <app-section-heading title="Ready queue &amp; processes" icon="≡" tone="queue" />
    <span class="count-badge">{{ processes.length }} total</span>
  </div>
  @if (processes.length === 0) {
    <div class="empty-state">
      <span class="empty-icon" aria-hidden="true">∅</span>
      <p>No processes in the queue</p>
      <span>Add a process to get started.</span>
    </div>
  } @else {
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th scope="col">Process</th>
            <th scope="col">Profile</th>
            <th scope="col">Arrival</th>
            <th scope="col">CPU</th>
            <th scope="col">I/O</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          @for (p of processes; track p.pid) {
            <tr>
              <td><span class="process-id"><span class="process-dot" [style.background-color]="p.color"></span>{{ p.pid }}</span></td>
              <td><app-workload-badge [type]="p.type" /></td>
              <td class="numeric-cell">{{ p.arrival }}</td>
              <td class="numeric-cell">{{ p.cpuBurst }}</td>
              <td class="numeric-cell">{{ p.ioBurst }}</td>
              <td class="action-cell">
                <button class="icon-button" type="button" (click)="processRemoved.emit(p.pid)" [attr.aria-label]="'Remove process ' + p.pid" title="Remove process">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</section>
