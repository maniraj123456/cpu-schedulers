<div class="app-shell">
  <header class="page-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <rect x="9" y="9" width="6" height="6"></rect>
          <path d="M9 1v3m6-3v3m-6 16v3m6-3v3M1 9h3m-3 5h3m16-5h3m-3 5h3"></path>
        </svg>
      </div>
      <div>
        <h1>Systems Lab <span>OS Simulator</span></h1>
        <p>Compare FCFS, SJF, Round Robin, and CFS scheduling</p>
      </div>
    </div>
    <label class="quantum-control" for="round-robin-quantum">
      <span>RR time quantum</span>
      <output for="round-robin-quantum">{{ roundRobinQuantum() }} <small>ms</small></output>
      <input
        id="round-robin-quantum"
        type="range"
        min="1"
        max="20"
        step="1"
        [value]="roundRobinQuantum()"
        [attr.aria-valuetext]="roundRobinQuantum() + ' milliseconds'"
        aria-label="Round Robin time quantum"
        (input)="setRoundRobinQuantum($event)"
      >
    </label>
  </header>

  <main>
    <section class="workspace-grid" aria-label="Process setup">
      <app-process-form [nextPid]="nextPid()" (processAdded)="addProcess($event)" />
      <app-process-queue [processes]="processes()" (processRemoved)="removeProcess($event)" />
    </section>
    <app-execution-timeline [schedulerRuns]="schedulerRuns()" [simulationRun]="simulationRun()" />
    <app-scheduler-metrics
      [metrics]="metrics()"
      [isSimulating]="isSimulating()"
      [canRunSimulation]="processes().length > 0"
      (runSimulation)="runSimulation()"
    />
  </main>
  <footer class="page-footer">SYSTEMS LAB <span>•</span> CPU SCHEDULER SIMULATOR</footer>
</div>
