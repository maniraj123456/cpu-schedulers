<div class="app-shell">
  <header class="page-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          <rect x="9" y="9" width="6" height="6"></rect>
          <path d="M9 1v3m6-3v3m-6 16v3m6-3v3M1 9h3m-3 5h3m16-5h3m-3 5h3"></path>
        </svg>
      </div>
      <div>
        <h1>Systems Lab <span>OS Simulator</span></h1>
        <p>Compare FCFS, SJF, Round Robin, and CFS scheduling</p>
      </div>
    </div>
    <button class="primary-button run-button" type="button" (click)="runSimulation()" [disabled]="isSimulating() || processes().length === 0">
      @if (isSimulating()) {
        <span class="spinner" aria-hidden="true"></span>
        Simulating…
      } @else {
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.69l11.2-7.2a.8.8 0 0 0 0-1.38L8.2 4.11A.8.8 0 0 0 7 4.8Z"></path></svg>
        Run simulation
      }
    </button>
  </header>

  <main>
    <section class="workspace-grid" aria-label="Process setup">
      <app-process-form [nextPid]="nextPid()" (processAdded)="addProcess($event)" />
      <app-process-queue [processes]="processes()" (processRemoved)="removeProcess($event)" />
    </section>
    <app-execution-timeline [processes]="processes()" [simulationRun]="simulationRun()" />
    <app-scheduler-metrics [metrics]="metrics()" />
  </main>
  <footer class="page-footer">SYSTEMS LAB <span>•</span> CPU SCHEDULER SIMULATOR</footer>
</div>
